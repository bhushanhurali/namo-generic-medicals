<div class="topline">
  {{ content.neighbourhood }} 
</div>
<header (keydown.escape)="menuOpen.set(false)">
  <div class="header-inner">
    <a class="brand" href="#home" (click)="menuOpen.set(false)">
      <span class="brand-mark" aria-hidden="true">✚</span>
      <span>{{ content.name }}</span>
    </a>
    <div class="actions">
      <button
        class="icon-button"
        type="button"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'light' ? content.darkTheme : content.lightTheme"
        [attr.title]="theme.theme() === 'light' ? content.darkTheme : content.lightTheme"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          @if (theme.theme() === 'light') {
            <path d="M20.5 13.2A8.5 8.5 0 0 1 10.8 3.5 8.5 8.5 0 1 0 20.5 13.2Z" />
          } @else {
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          }
        </svg>
      </button>
      <button
        class="icon-button menu-toggle"
        type="button"
        aria-controls="main-navigation"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? content.closeMenu : content.openMenu"
        (click)="menuOpen.set(!menuOpen())"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        >
          @if (menuOpen()) {
            <path d="m6 6 12 12M6 18 18 6" />
          } @else {
            <path d="M4 6h16M4 12h16M4 18h16" />
          }
        </svg>
      </button>
    </div>
    <nav
      id="main-navigation"
      [class.is-open]="menuOpen()"
      [attr.aria-label]="content.mainNavigation"
    >
      <a href="#home" (click)="menuOpen.set(false)">{{ content.home }}</a>
      <a href="#about" (click)="menuOpen.set(false)">{{ content.about }}</a>
      <a href="#services" (click)="menuOpen.set(false)">{{ content.services }}</a>
      <a href="#gallery" (click)="menuOpen.set(false)">{{ content.gallery }}</a>
      <a href="#contact" (click)="menuOpen.set(false)">{{ content.contact }}</a>
    </nav>
  </div>
</header>
