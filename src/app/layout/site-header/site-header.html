<div class="topline">
  {{ content.neighbourhood }}
</div>
<header (keydown.escape)="menuOpen.set(false)">
  <div class="header-inner">
    <a class="brand" href="#home" (click)="menuOpen.set(false)">
      <span class="brand-mark" aria-hidden="true">✚</span>
      <span>{{ content.name }}</span>
    </a>
    <div class="actions">
      <button
        appButton="icon"
        type="button"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'light' ? content.darkTheme : content.lightTheme"
        [attr.title]="theme.theme() === 'light' ? content.darkTheme : content.lightTheme"
      >
        <app-icon [name]="theme.theme() === 'light' ? 'moon' : 'sun'" />
      </button>
      <button
        appButton="icon"
        class="menu-toggle"
        type="button"
        aria-controls="main-navigation"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? content.closeMenu : content.openMenu"
        (click)="menuOpen.set(!menuOpen())"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
      </button>
    </div>
    <nav
      id="main-navigation"
      [class.is-open]="menuOpen()"
      [attr.aria-label]="content.mainNavigation"
    >
      <a href="#home" (click)="menuOpen.set(false)">{{ content.home }}</a>
      <a href="#about" (click)="menuOpen.set(false)">{{ content.about }}</a>
      <a href="#services" (click)="menuOpen.set(false)">{{ content.services }}</a>
      <a href="#gallery" (click)="menuOpen.set(false)">{{ content.gallery }}</a>
      <a href="#contact" (click)="menuOpen.set(false)">{{ content.contact }}</a>
    </nav>
  </div>
</header>
